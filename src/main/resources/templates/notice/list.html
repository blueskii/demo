<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Demo 공지사항 게시판">
	<title>공지사항 | Demo</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
	<style>
		body { background: #f5f6f8; color: #20242b; }
		.navbar-brand { font-weight: 700; letter-spacing: -.03em; }
		.board-card { border: 0; border-radius: 1rem; box-shadow: 0 12px 36px rgba(31, 41, 55, .08); }
		.notice-title { cursor: pointer; font-weight: 600; }
		.notice-title:hover { color: #0d6efd; }
		.empty-state { padding: 5rem 1rem; color: #6c757d; }
		.content-preview { white-space: pre-wrap; }
	</style>
</head>
<body>
	<nav class="navbar bg-white border-bottom">
		<div class="container py-2">
			<a class="navbar-brand" th:href="@{/}"><i class="bi bi-megaphone me-2"></i>Demo</a>
			<span class="text-secondary small">NOTICE BOARD</span>
		</div>
	</nav>

	<main class="container py-5">
		<div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-end gap-3 mb-4">
			<div>
				<p class="text-primary fw-semibold small mb-2">COMMUNITY</p>
				<h1 class="h2 fw-bold mb-1">공지사항</h1>
				<p class="text-secondary mb-0">새로운 소식과 주요 안내를 확인하세요.</p>
			</div>
			<button class="btn btn-primary" type="button" id="createButton">
				<i class="bi bi-pencil-square me-1"></i> 새 공지 작성
			</button>
		</div>

		<div id="alertArea" aria-live="polite"></div>
		<section class="card board-card">
			<div class="card-body p-0">
				<div class="table-responsive">
					<table class="table table-hover align-middle mb-0">
						<thead class="table-light">
							<tr>
								<th class="ps-4" scope="col">번호</th>
								<th scope="col">제목</th>
								<th scope="col">작성자</th>
								<th scope="col">작성일</th>
								<th class="text-end pe-4" scope="col">관리</th>
							</tr>
						</thead>
						<tbody id="noticeRows"></tbody>
					</table>
				</div>
				<div class="empty-state text-center d-none" id="emptyState">
					<i class="bi bi-inbox fs-1 d-block mb-2"></i>
					등록된 공지사항이 없습니다.
				</div>
			</div>
		</section>
	</main>

	<div class="modal fade" id="noticeModal" tabindex="-1" aria-labelledby="noticeModalTitle" aria-hidden="true">
		<div class="modal-dialog modal-lg modal-dialog-centered">
			<div class="modal-content border-0 shadow">
				<form id="noticeForm">
					<div class="modal-header">
						<h2 class="modal-title fs-5" id="noticeModalTitle">새 공지 작성</h2>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
					</div>
					<div class="modal-body">
						<input type="hidden" id="noticeId">
						<div class="mb-3">
							<label class="form-label" for="title">제목</label>
							<input class="form-control" id="title" maxlength="100" required>
						</div>
						<div class="mb-3">
							<label class="form-label" for="author">작성자</label>
							<input class="form-control" id="author" maxlength="50" required>
						</div>
						<div>
							<label class="form-label" for="content">내용</label>
							<textarea class="form-control" id="content" rows="8" maxlength="5000" required></textarea>
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
						<button type="submit" class="btn btn-primary" id="saveButton">저장</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<div class="modal fade" id="detailModal" tabindex="-1" aria-labelledby="detailTitle" aria-hidden="true">
		<div class="modal-dialog modal-lg modal-dialog-centered">
			<div class="modal-content border-0 shadow">
				<div class="modal-header">
					<h2 class="modal-title fs-5" id="detailTitle"></h2>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
				</div>
				<div class="modal-body">
					<p class="small text-secondary" id="detailMeta"></p>
					<div class="content-preview" id="detailContent"></div>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		const noticeModal = new bootstrap.Modal('#noticeModal');
		const detailModal = new bootstrap.Modal('#detailModal');
		const form = document.querySelector('#noticeForm');

		function escapeHtml(value) {
			const element = document.createElement('div');
			element.textContent = value;
			return element.innerHTML;
		}

		function formatDate(value) {
			return new Intl.DateTimeFormat('ko-KR', { dateStyle: 'medium' }).format(new Date(value));
		}

		function showAlert(message, type = 'success') {
			document.querySelector('#alertArea').innerHTML =
				`<div class="alert alert-${type} alert-dismissible fade show">${escapeHtml(message)}
				<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="닫기"></button></div>`;
		}

		async function request(url, options) {
			const response = await fetch(url, options);
			if (!response.ok) {
				const error = await response.json().catch(() => ({}));
				throw new Error(error.message || '요청을 처리하지 못했습니다.');
			}
			return response.status === 204 ? null : response.json();
		}

		async function loadNotices() {
			try {
				const notices = await request('/api/notice');
				const rows = document.querySelector('#noticeRows');
				document.querySelector('#emptyState').classList.toggle('d-none', notices.length > 0);
				rows.innerHTML = notices.map(notice => `
					<tr>
						<td class="ps-4 text-secondary">${notice.id}</td>
						<td><button class="btn btn-link text-dark text-decoration-none p-0 notice-title"
							data-action="view" data-id="${notice.id}">${escapeHtml(notice.title)}</button></td>
						<td>${escapeHtml(notice.author)}</td>
						<td>${formatDate(notice.createdAt)}</td>
						<td class="text-end pe-4 text-nowrap">
							<button class="btn btn-sm btn-outline-secondary" data-action="edit" data-id="${notice.id}">수정</button>
							<button class="btn btn-sm btn-outline-danger" data-action="delete" data-id="${notice.id}">삭제</button>
						</td>
					</tr>`).join('');
			} catch (error) {
				showAlert(error.message, 'danger');
			}
		}

		function openCreate() {
			form.reset();
			document.querySelector('#noticeId').value = '';
			document.querySelector('#noticeModalTitle').textContent = '새 공지 작성';
			noticeModal.show();
		}

		async function getNotice(id) {
			return request(`/api/notice/${id}`);
		}

		async function viewNotice(id) {
			try {
				const notice = await getNotice(id);
				document.querySelector('#detailTitle').textContent = notice.title;
				document.querySelector('#detailMeta').textContent = `${notice.author} · ${formatDate(notice.createdAt)}`;
				document.querySelector('#detailContent').textContent = notice.content;
				detailModal.show();
			} catch (error) {
				showAlert(error.message, 'danger');
			}
		}

		async function editNotice(id) {
			try {
				const notice = await getNotice(id);
				document.querySelector('#noticeId').value = notice.id;
				document.querySelector('#title').value = notice.title;
				document.querySelector('#author').value = notice.author;
				document.querySelector('#content').value = notice.content;
				document.querySelector('#noticeModalTitle').textContent = '공지 수정';
				noticeModal.show();
			} catch (error) {
				showAlert(error.message, 'danger');
			}
		}

		async function deleteNotice(id) {
			if (!confirm('이 공지사항을 삭제하시겠습니까?')) return;
			try {
				await request(`/api/notice/${id}`, { method: 'DELETE' });
				showAlert('공지사항을 삭제했습니다.');
				await loadNotices();
			} catch (error) {
				showAlert(error.message, 'danger');
			}
		}

		document.querySelector('#createButton').addEventListener('click', openCreate);
		document.querySelector('#noticeRows').addEventListener('click', event => {
			const button = event.target.closest('[data-action]');
			if (!button) return;
			const actions = { view: viewNotice, edit: editNotice, delete: deleteNotice };
			actions[button.dataset.action](button.dataset.id);
		});

		form.addEventListener('submit', async event => {
			event.preventDefault();
			const id = document.querySelector('#noticeId').value;
			const payload = {
				title: document.querySelector('#title').value.trim(),
				author: document.querySelector('#author').value.trim(),
				content: document.querySelector('#content').value.trim()
			};
			try {
				await request(id ? `/api/notice/${id}` : '/api/notice', {
					method: id ? 'PUT' : 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(payload)
				});
				noticeModal.hide();
				showAlert(id ? '공지사항을 수정했습니다.' : '공지사항을 등록했습니다.');
				await loadNotices();
			} catch (error) {
				showAlert(error.message, 'danger');
			}
		});

		loadNotices();
	</script>
</body>
</html>
