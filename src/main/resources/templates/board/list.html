<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Demo 자유 게시판">
	<title>자유 게시판 | Demo</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
	<style>
		body { background: #f8f9fb; color: #1f2328; }
		.navbar-brand { font-weight: 700; letter-spacing: -.03em; }
		.board-card { border: 0; border-radius: 1rem; box-shadow: 0 12px 36px rgba(31, 41, 55, .08); }
		.post-title { cursor: pointer; font-weight: 600; }
		.post-title:hover { color: #0d6efd; }
		.empty-state { padding: 5rem 1rem; color: #6c757d; }
		.content-preview { white-space: pre-wrap; }
	</style>
</head>
<body>
	<nav class="navbar bg-white border-bottom">
		<div class="container py-2">
			<a class="navbar-brand" th:href="@{/}"><i class="bi bi-chat-square-text me-2"></i>Demo</a>
			<span class="text-secondary small">FREE BOARD</span>
		</div>
	</nav>

	<main class="container py-5">
		<div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-end gap-3 mb-4">
			<div>
				<p class="text-primary fw-semibold small mb-2">COMMUNITY</p>
				<h1 class="h2 fw-bold mb-1">자유 게시판</h1>
				<p class="text-secondary mb-0">자유롭게 소식을 남기고 함께 이야기를 나눠 보세요.</p>
			</div>
			<button class="btn btn-primary" type="button" id="createButton">
				<i class="bi bi-pencil-square me-1"></i> 새 글 작성
			</button>
		</div>

		<div id="alertArea" aria-live="polite"></div>
		<section class="card board-card">
			<div class="card-body p-0">
				<div class="table-responsive">
					<table class="table table-hover align-middle mb-0">
						<caption class="visually-hidden">자유 게시판 게시글 목록</caption>
						<thead class="table-light">
							<tr>
								<th class="ps-4" scope="col">번호</th>
								<th scope="col">제목</th>
								<th scope="col">작성자</th>
								<th scope="col">작성일</th>
								<th class="text-end pe-4" scope="col">관리</th>
							</tr>
						</thead>
						<tbody id="boardRows"></tbody>
					</table>
				</div>
				<div class="empty-state text-center d-none" id="emptyState">
					<i class="bi bi-inbox fs-1 d-block mb-2"></i>
					등록된 게시글이 없습니다.
				</div>
			</div>
		</section>
	</main>

	<div class="modal fade" id="boardModal" tabindex="-1" aria-labelledby="boardModalTitle" aria-hidden="true">
		<div class="modal-dialog modal-lg modal-dialog-centered">
			<div class="modal-content border-0 shadow">
				<form id="boardForm">
					<div class="modal-header">
						<h2 class="modal-title fs-5" id="boardModalTitle">새 글 작성</h2>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
					</div>
					<div class="modal-body">
						<input type="hidden" id="boardId">
						<div class="mb-3">
							<label class="form-label" for="title">제목</label>
							<input class="form-control" id="title" maxlength="100" required>
						</div>
						<div class="mb-3">
							<label class="form-label" for="author">작성자</label>
							<input class="form-control" id="author" maxlength="50" required>
						</div>
						<div>
							<label class="form-label" for="content">내용</label>
							<textarea class="form-control" id="content" rows="8" maxlength="5000" required></textarea>
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
						<button type="submit" class="btn btn-primary">저장</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<div class="modal fade" id="detailModal" tabindex="-1" aria-labelledby="detailTitle" aria-hidden="true">
		<div class="modal-dialog modal-lg modal-dialog-centered">
			<div class="modal-content border-0 shadow">
				<div class="modal-header">
					<h2 class="modal-title fs-5" id="detailTitle"></h2>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
				</div>
				<div class="modal-body">
					<p class="small text-secondary" id="detailMeta"></p>
					<div class="content-preview" id="detailContent"></div>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalTitle" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content border-0 shadow">
				<div class="modal-header">
					<h2 class="modal-title fs-5" id="deleteModalTitle">게시글 삭제</h2>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
				</div>
				<div class="modal-body">
					선택한 게시글을 삭제하시겠습니까?
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
					<button type="button" class="btn btn-danger" id="confirmDeleteButton">삭제</button>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		const boardModal = new bootstrap.Modal('#boardModal');
		const detailModal = new bootstrap.Modal('#detailModal');
		const deleteModal = new bootstrap.Modal('#deleteModal');
		const form = document.querySelector('#boardForm');
		let pendingDeleteId = null;

		function escapeHtml(value) {
			const element = document.createElement('div');
			element.textContent = value;
			return element.innerHTML;
		}

		function formatDate(value) {
			if (!value) {
				return '-';
			}
			return value.replace('T', ' ').slice(0, 16);
		}

		function showAlert(message, type = 'success') {
			document.querySelector('#alertArea').innerHTML =
				`<div class="alert alert-${type} alert-dismissible fade show">${escapeHtml(message)}
				<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="닫기"></button></div>`;
		}

		async function request(url, options) {
			const response = await fetch(url, options);
			if (!response.ok) {
				const body = await response.text();
				const contentType = response.headers.get('content-type') || '';
				if (contentType.includes('application/json')) {
					const error = JSON.parse(body || '{}');
					throw new Error(error.message || '요청을 처리하지 못했습니다.');
				}
				throw new Error(body || '요청을 처리하지 못했습니다.');
			}
			if (response.status === 204) {
				return null;
			}
			const contentType = response.headers.get('content-type') || '';
			if (!contentType.includes('application/json')) {
				return null;
			}
			return response.json();
		}

		async function loadBoards() {
			try {
				const posts = await request('/api/board');
				const rows = document.querySelector('#boardRows');
				document.querySelector('#emptyState').classList.toggle('d-none', posts.length > 0);
				rows.innerHTML = posts.length === 0 ? '' : posts.map(post => `
					<tr>
						<td class="ps-4 text-secondary">${post.id}</td>
						<td><button class="btn btn-link text-dark text-decoration-none p-0 post-title"
							data-action="view" data-id="${post.id}">${escapeHtml(post.title)}</button></td>
						<td>${escapeHtml(post.author)}</td>
						<td>${formatDate(post.createdAt)}</td>
						<td class="text-end pe-4 text-nowrap">
							<button class="btn btn-sm btn-outline-secondary" data-action="edit" data-id="${post.id}">수정</button>
							<button class="btn btn-sm btn-outline-danger" data-action="delete" data-id="${post.id}">삭제</button>
						</td>
					</tr>`).join('');
			} catch (error) {
				showAlert(error.message, 'danger');
			}
		}

		function openCreate() {
			form.reset();
			document.querySelector('#boardId').value = '';
			document.querySelector('#boardModalTitle').textContent = '새 글 작성';
			boardModal.show();
		}

		async function getBoard(id) {
			return request(`/api/board/${id}`);
		}

		async function viewBoard(id) {
			try {
				const post = await getBoard(id);
				document.querySelector('#detailTitle').textContent = post.title;
				document.querySelector('#detailMeta').textContent = `${post.author} · ${formatDate(post.createdAt)}`;
				document.querySelector('#detailContent').textContent = post.content;
				detailModal.show();
			} catch (error) {
				showAlert(error.message, 'danger');
			}
		}

		async function editBoard(id) {
			try {
				const post = await getBoard(id);
				document.querySelector('#boardId').value = post.id;
				document.querySelector('#title').value = post.title;
				document.querySelector('#author').value = post.author;
				document.querySelector('#content').value = post.content;
				document.querySelector('#boardModalTitle').textContent = '게시글 수정';
				boardModal.show();
			} catch (error) {
				showAlert(error.message, 'danger');
			}
		}

		async function deleteBoard(id) {
			pendingDeleteId = id;
			deleteModal.show();
		}

		async function confirmDelete() {
			if (!pendingDeleteId) return;
			try {
				await request(`/api/board/${pendingDeleteId}`, { method: 'DELETE' });
				deleteModal.hide();
				showAlert('게시글을 삭제했습니다.');
				await loadBoards();
			} catch (error) {
				showAlert(error.message, 'danger');
			} finally {
				pendingDeleteId = null;
			}
		}

		document.querySelector('#createButton').addEventListener('click', openCreate);
		document.querySelector('#confirmDeleteButton').addEventListener('click', confirmDelete);
		document.querySelector('#boardRows').addEventListener('click', event => {
			const button = event.target.closest('[data-action]');
			if (!button) return;
			const actions = { view: viewBoard, edit: editBoard, delete: deleteBoard };
			actions[button.dataset.action](button.dataset.id);
		});

		form.addEventListener('submit', async event => {
			event.preventDefault();
			const id = document.querySelector('#boardId').value;
			const payload = {
				title: document.querySelector('#title').value.trim(),
				author: document.querySelector('#author').value.trim(),
				content: document.querySelector('#content').value.trim()
			};
			try {
				await request(id ? `/api/board/${id}` : '/api/board', {
					method: id ? 'PUT' : 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(payload)
				});
				boardModal.hide();
				showAlert(id ? '게시글을 수정했습니다.' : '게시글을 등록했습니다.');
				await loadBoards();
			} catch (error) {
				showAlert(error.message, 'danger');
			}
		});

		loadBoards();
	</script>
</body>
</html>
